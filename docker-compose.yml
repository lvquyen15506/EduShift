services:
  db:
    image: postgres:15-alpine
    container_name: edushift_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edushift
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edushift"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    container_name: edushift_api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/edushift
      JWT_SECRET: edushift-compose-secret-change-me
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@edushift.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      PAYMENTS_MODE: ${PAYMENTS_MODE:-disabled}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
    volumes: [./backend:/app]
    command: sh -c "python -m seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]
    restart: unless-stopped
  push-worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/edushift
      JWT_SECRET: edushift-compose-secret-change-me
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@edushift.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_started}
    volumes: [./backend:/app]
    command: python -m app.push_worker
    restart: unless-stopped
  web:
    build:
      context: ./web-app
      target: dev
    container_name: edushift_web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_PROXY_TARGET: http://api:8000
    depends_on: [api]
    volumes: [./web-app:/app, /app/node_modules, /app/.next]
    command: npm run dev
    restart: unless-stopped
volumes:
  postgres_data:

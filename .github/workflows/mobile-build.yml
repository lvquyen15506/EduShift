name: Check and Build Mobile App

on:
  push:
    branches: [dev, main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Bản thử nội bộ hoặc gửi iOS lên TestFlight'
        required: true
        default: preview
        type: choice
        options: [preview, testflight]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir dist

  preview:
    if: (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EXPO_BUILD_READY == 'true')
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        working-directory: mobile-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Check EAS setup
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Thiếu secret EXPO_TOKEN'; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo 'Thiếu variable EXPO_PROJECT_ID'; exit 1; }
      - name: Build installable app
        run: npx --yes eas-cli@latest build --platform "${{ matrix.platform }}" --profile preview --non-interactive --json > eas-build.json
      - name: Download build artifact
        run: |
          url=$(jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' eas-build.json)
          test -n "$url" || { echo 'EAS không trả URL bản build'; exit 1; }
          mkdir -p build
          if [ "${{ matrix.platform }}" = android ]; then extension=apk; else extension=ipa; fi
          curl --fail --location --retry 3 "$url" --output "build/edushift.$extension"
          unzip -t "build/edushift.$extension" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: edushift-${{ matrix.platform }}-${{ github.run_number }}
          path: mobile-app/build/
          if-no-files-found: error
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testflight'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - name: Check EAS setup
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Thiếu secret EXPO_TOKEN'; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo 'Thiếu variable EXPO_PROJECT_ID'; exit 1; }
      - name: Build and submit iOS to TestFlight
        run: npx --yes eas-cli@latest build --platform ios --profile production --auto-submit --non-interactive
